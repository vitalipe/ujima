# Nord — UjimaOS's Geany colour scheme, authored for UjimaOS (same licence as the repo).
# Palette: Nord (nordtheme.com, MIT) — matches the shell's Nordic skin.
[theme_info]
name=Nord
description=Dark Nord editor scheme for UjimaOS
version=1
author=UjimaOS
compat=1.22;1.23;1.24;2.0

[named_colors]
nord0=#2e3440
nord1=#3b4252
nord2=#434c5e
nord3=#4c566a
nord3b=#616e88
nord4=#d8dee9
nord6=#eceff4
nord7=#8fbcbb
nord8=#88c0d0
nord9=#81a1c1
nord10=#5e81ac
nord11=#bf616a
nord12=#d08770
nord13=#ebcb8b
nord14=#a3be8c
nord15=#b48ead

[named_styles]
default=nord4;nord0;false;false
error=nord11;;false;italic

# editor
selection=;nord2;false;true
current_line=;nord1;true
brace_good=nord8;nord3;true;false
brace_bad=nord11;;true;false
margin_line_number=nord3b;nord0
margin_folding=nord3b;nord1
fold_symbol_highlight=nord4
indent_guide=nord3
caret=nord6;;false
marker_line=nord13;nord2
marker_search=;nord10
marker_mark=nord14;nord1
call_tips=nord3b;nord1;false;false
white_space=nord3;;true

# programming languages
comment=nord3b
comment_doc=nord3b;;;true
comment_line=comment
comment_line_doc=comment_doc
comment_doc_keyword=comment_doc,bold
comment_doc_keyword_error=comment_doc,italic

number=nord15
number_1=number
number_2=number_1

type=nord7;;true;false
class=type
function=nord8
parameter=nord4

keyword=nord9;;true;false
keyword_1=keyword
keyword_2=nord10;;true;false
keyword_3=keyword_1
keyword_4=keyword_1

identifier=default
identifier_1=identifier
identifier_2=identifier_1
identifier_3=identifier_1
identifier_4=identifier_1

string=nord14
string_1=string
string_2=string_1
string_3=default
string_4=default
string_eol=nord11;;false;false
character=nord13
backticks=string_2
here_doc=string_2

scalar=string_2
label=default,bold
preprocessor=nord10
regex=nord13
operator=nord9
decorator=nord12,bold
other=default

# markup
tag=nord9
tag_unknown=tag,bold
tag_end=tag,bold
attribute=nord7
attribute_unknown=attribute,bold
value=string_1
entity=default

# diff
line_added=nord14
line_removed=nord11
line_changed=nord13
