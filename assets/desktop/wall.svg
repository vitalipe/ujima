<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice">
  <!-- UjimaOS desktop background = the launcher's base + glows, as a vector source.
       The transparent launcher/top bar show this through, so one gradient sits under
       everything (matches launcher.css: #14171b + frost top-left + sand bottom-right). -->
  <defs>
    <radialGradient id="frost" cx="0.22" cy="0.10" r="0.5">
      <stop offset="0"    stop-color="#88c0d0" stop-opacity="0.08"/>
      <stop offset="0.66" stop-color="#88c0d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sand" cx="0.84" cy="0.88" r="0.5">
      <stop offset="0"    stop-color="#cba878" stop-opacity="0.07"/>
      <stop offset="0.68" stop-color="#cba878" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="#14171b"/>
  <rect width="1280" height="800" fill="url(#frost)"/>
  <rect width="1280" height="800" fill="url(#sand)"/>
</svg>
