<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle — UjimaOS</title>
<link rel="stylesheet" href="/circle.css">
</head>
<body>

<div class="toast" id="toast" aria-live="polite"></div>
<span class="selfnote" id="selfnote"></span>
<div class="fcontrols">
  <div class="seg" role="group" aria-label="View">
    <button id="vring" class="on" onclick="setView('ring')">Ring</button>
    <button id="vgrid" onclick="setView('grid')">Grid</button>
  </div>
</div>

<main id="stage" aria-label="Machines"></main>

<div class="bar" id="bar">
  <div class="verbs" id="verbs"></div>
</div>

<div class="ovl" id="ovl"><div class="sheet" id="sheet"></div></div>

<script src="/circle.js"></script>
</body>
</html>
