<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console — UjimaOS</title>
<style>
/* Console chooser — one dock icon opens this; the teacher picks a panel. */
:root{
  color-scheme:dark;
  --bg:#14171b; --panel:#1b2027; --panel-brd:#282e38;
  --text:#e7eaef; --dim:#9aa4b2; --faint:#697180;
  --frost:136,192,208; --sel:126,158,214;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  color:var(--text); background-color:var(--bg);
  background-image:radial-gradient(ellipse 130% 90% at 50% -12%, #1a2029 0%, #14171b 58%);
  background-attachment:fixed;
  font-family:'Public Sans',system-ui,'Noto Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none; -webkit-user-select:none; cursor:default;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  padding:24px;
}
h1{font-size:15px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--dim)}
.tiles{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:14px;
  width:min(250px,72vw);padding:38px 24px 30px;border-radius:22px;
  background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  text-decoration:none;color:var(--text);
  transition:box-shadow .15s ease,transform .15s ease,background .15s ease;
}
.tile:hover{background:#1e242c;box-shadow:inset 0 0 0 1.5px rgba(var(--sel),.55);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid rgba(var(--sel),.7);outline-offset:3px}
.tile svg{width:96px;height:96px;fill:none;stroke:rgb(var(--frost));
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-size:19px;font-weight:700;letter-spacing:-.2px}
.tile .ds{font-size:12.5px;color:var(--faint);text-align:center;line-height:1.45}
</style>
</head>
<body>

<h1>UjimaOS</h1>

<div class="tiles">
  <a class="tile" href="circle/">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="1.6"/>
      <path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/>
      <path d="M19.1 4.9a10 10 0 0 1 0 14.2"/><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/>
    </svg>
    <span class="nm">Circle</span>
    <span class="ds">Guide every screen — apps, sound, locks, power</span>
  </a>
  <a class="tile" href="setup/">
    <svg viewBox="0 0 24 24">
      <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
    </svg>
    <span class="nm">Setup</span>
    <span class="ds">Machines' names, clock, keyboard and checks</span>
  </a>
</div>

</body>
</html>
