<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UjimaOS launcher</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- Launcher home surface (design turn 47a). JUST the launcher: identity + status + the app
       grid. The top bar and dock stay eww's — this window fills the space between them. -->
  <div class="home">

    <header class="head">
      <div class="ident">
        <span class="ident-glyph" data-glyph="monitor-dot"></span>
        <span class="ident-name" id="hostname">—</span>
      </div>
      <div class="status">
        <div class="stat">
          <span class="wifi"><i id="wifi-0"></i><i id="wifi-1"></i><i id="wifi-2"></i><i id="wifi-3"></i></span>
          <span class="stat-label" id="net-label">Online</span>
        </div>
        <span class="sep"></span>
        <div class="stat">
          <span class="stat-label">Room to work</span>
          <span class="room" id="room"></span>
        </div>
      </div>
    </header>

    <main class="stage">
      <div class="catgrid" id="catgrid"></div>
    </main>

  </div>
  <script src="launcher.js"></script>
</body>
</html>
