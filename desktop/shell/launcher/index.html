<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UjimaOS launcher</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- Launcher home surface (design turn 47a). JUST the launcher: identity + the app grid.
       The top bar and dock stay eww's — this window fills the space between them. -->
  <div class="home">

    <header class="head">
      <div class="ident">
        <span class="ident-glyph" data-glyph="monitor-dot"></span>
        <span class="ident-name" id="name">—</span>
        <span class="ident-serial" id="serial"></span>
      </div>
    </header>

    <main class="stage">
      <div class="catgrid" id="catgrid"></div>
    </main>

  </div>
  <script src="launcher.js"></script>
</body>
</html>
