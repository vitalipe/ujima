; seeded default; the app rewrites this file as the user changes things. UITheme names a
; local theme by PATH — the suite reads ../uithemes/*.json beside this file, and dropping
; one there is all its own "Add local theme" does. appdata is the suite's settings blob
; (base64 json), which names the same theme by id. titlebar=system hands the window buttons
; to the WM, and under i3 there are none.
[General]
UITheme=/home/ujima/.local/share/onlyoffice/desktopeditors/uithemes/theme-ujima.json
appdata="@ByteArray(eyJ1aXRoZW1lIjoidGhlbWUtdWppbWEifQ==)"
titlebar=system
