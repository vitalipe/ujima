; seeded default; the app rewrites this file as the user changes things. Only what a fresh
; profile was seen to honour: the dark theme, named twice because appdata is the suite's own
; settings blob (base64 json) and UITheme is Qt's mirror of it, and titlebar=system, which
; hands the window buttons to the WM — under i3 there are none, so the suite's own
; minimise/maximise/close go away. A fresh profile of its own writes titlebar=custom only.
[General]
UITheme=theme-dark
appdata="@ByteArray(eyJ1aXRoZW1lIjoidGhlbWUtZGFyayJ9)"
titlebar=system
