<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Locked</title>
<style>
  /* UjimaOS lock screen. Matches the desktop theme (launcher.css / wall.svg):
     #14171b base with a frost (top-left) + sand (bottom-right) glow, Public Sans. */
  :root{
    --bg:#14171b; --panel:#1b2027; --brd:#282e38;
    --text:#e7eaef; --dim:#9aa4b2; --faint:#697180;
    --frost:136,192,208;
  }
  *{margin:0; padding:0; box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(50% 50% at 22% 10%, rgba(var(--frost),.08), transparent 66%),
      radial-gradient(50% 50% at 84% 88%, rgba(203,168,120,.07), transparent 68%),
      var(--bg);
    color:var(--text);
    font-family:'Public Sans',system-ui,'Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh; width:100vw; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    cursor:none; user-select:none;
  }
  .card{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:26px; padding:0 40px;
  }
  .lock{
    width:96px; height:96px; border-radius:28px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(var(--frost),.10);
    box-shadow:inset 0 0 0 1.5px rgba(var(--frost),.28);
    color:rgb(var(--frost));
  }
  .lock svg{width:46px; height:46px}
  .title{font-size:40px; font-weight:700; letter-spacing:-.6px; line-height:1}
  .clock{margin-top:10px; display:flex; flex-direction:column; align-items:center; gap:4px}
  .time{font-size:22px; font-weight:600; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:.5px}
  .date{font-size:13px; color:var(--faint); font-weight:500; text-transform:uppercase; letter-spacing:1.2px}
</style>
</head>
<body oncontextmenu="return false">
  <div class="card">
    <div class="lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="11" width="16" height="10" rx="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <div class="title">Locked</div>
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <script>
    'use strict';
    const t = document.getElementById('time');
    const d = document.getElementById('date');
    function tick(){
      const n = new Date();
      t.textContent = n.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
      d.textContent = n.toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'long'});
    }
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
