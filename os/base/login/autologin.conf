# managed by the ujima image build — source: os/base/login/autologin.conf
#
# Log ujima straight into a tty1 console on boot — no password prompt. This is the
# Lite/console form of 'logged in'; the desktop session supersedes it (ujima.service
# Conflicts=getty@tty1 takes the tty over). Canonical systemd drop-in (the same one
# raspi-config writes): the empty ExecStart clears the unit's inherited command, then
# agetty --autologin replaces it. Nothing ships an autologin drop-in on the stripped
# base (cloud-init + userconfig are off), so this is the only one.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin ujima --noclear %I $TERM
