# managed by the ujima image build — source: os/desktop/theme/settings.ini
#
# shell typography + app-content theme, system-wide GTK defaults: Nordic + /etc/gtk-3.0
# give GTK app content (pcmanfm, LO, dialogs) the design's Nord side; Public Sans is the
# shell face (eww.scss) — vendored data files, no apt, so the skin is freeze-safe. Qt
# apps follow via QT_QPA_PLATFORMTHEME=gtk3 (session/ujima.service).
[Settings]
gtk-theme-name=Nordic
gtk-application-prefer-dark-theme=1
gtk-font-name=Public Sans 10
