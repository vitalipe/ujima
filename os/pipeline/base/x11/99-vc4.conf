# managed by the ujima image build — source: os/pipeline/base/x11/99-vc4.conf
#
# Pi 5 splits the render GPU (card0/v3d) from the display (card1); Xorg's autoconfig
# latches onto the render node and dies "no screens found". Mark the vc4 KMS device
# as the primary GPU.
Section "OutputClass"
  Identifier "vc4"
  MatchDriver "vc4"
  Driver "modesetting"
  Option "PrimaryGPU" "true"
EndSection
