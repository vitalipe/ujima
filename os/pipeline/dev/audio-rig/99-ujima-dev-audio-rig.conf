# managed by the ujima image build — source: os/pipeline/dev/audio-rig/99-ujima-dev-audio-rig.conf
#
# DEV RIG: the loopback sink classifies as :usb. snd-aloop is a REAL ALSA sink (honest
# volume/mute readback, unlike suspended null-sinks), and this rename rule makes it
# classify as :usb for ujimad (ujima.linux.audio/output-class matches "usb" in
# node.name) — so the volume glue is testable on a dev box with no USB/HDMI audio
# attached. Matches the exact aloop node name so the paired capture source stays
# untouched. (Takes effect after reboot / wireplumber restart.)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-snd_aloop.0.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.name        = "alsa_output.platform-snd_aloop.0.usb-dev-rig"
        node.description = "Dev USB Rig (aloop)"
      }
    }
  }
]
