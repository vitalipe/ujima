# managed by the ujima image build — source: os/pipeline/ujimaify/journal/ujima.conf
#
# Persistent, capped journal — backed by the dedicated logs partition (UJLOG, shared
# across slots) via slot->fstab's /var/log/journal bind. Storage=persistent is explicit:
# `auto` can stay volatile even with the dir present. The cap leaves half the 1G
# partition free for rotation slack.
[Journal]
Storage=persistent
SystemMaxUse=512M
