# managed by the ujima image build — source: os/pipeline/ujimaify/layout/ujima-layout.conf
#
# ujimad-writable settings storage (ujimad runs as ujima, the control plane writes scope
# files). /ujima/run holds the ephemeral scopes (session/activity) — under the overlay it
# lands in the tmpfs upper, so it must be recreated each boot. The `z` line fixes ownership
# of the device scope (the slot's own settings partition, mounted at /ujima/settings): the
# installer chowns its fs root at install time (autoboot/install-into-slot!), and tmpfiles —
# which runs after local-fs.target, i.e. after the partition is mounted — heals a
# reformatted or root-owned one.
# (The Files-area line lives in desktop's half: ujima-files.conf.)
d /ujima/run           0755 ujima ujima -
d /ujima/run/session   0755 ujima ujima -
z /ujima/settings      0755 ujima ujima -
